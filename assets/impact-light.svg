<svg xmlns="http://www.w3.org/2000/svg" width="870" height="348" viewBox="0 0 870 348" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Selected impact: $7,000 SuperHack 2025 runner-up; 6× Hackathon wins; 60% LLM cost cut; 100+ Users scaled; 89% Forecast precision; +20% Edge inference speed">
