<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Recognition: 6× hackathon winner, $10,000+ in prizes. SuperHack 2025 · global: Runner-up · $7,000 · 10,000+ teams; IEEE Global Hack: Winner; IEEE Group Video Competition: First place; Bhashini Technathon: Third place · special recognition; GST Analytics Hackathon 2024: Top 17 of 900+ teams · ₹25,000. Valedictorian, Class of 2026. B.Tech Computer Science, Vidyashilp University · 2022–2026; Full scholarship, Vidyashilp University &amp; Vidyagyan School; Vice Chair, IEEE Student Branch, Vidyashilp University · 2023–2025">
<title>Recognition: 6× hackathon winner, $10,000+ in prizes. SuperHack 2025 · global: Runner-up · $7,000 · 10,000+ teams; IEEE Global Hack: Winner; IEEE Group Video Competition: First place; Bhashini Technathon: Third place · special recognition; GST Analytics Hackathon 2024: Top 17 of 900+ teams · ₹25,000. Valedictorian, Class of 2026. B.Tech Computer Science, Vidyashilp University · 2022–2026; Full scholarship, Vidyashilp University &amp; Vidyagyan School; Vice Chair, IEEE Student Branch, Vidyashilp University · 2023–2025</title>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="440 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".05"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#d4d4d8"/></pattern>
  <radialGradient id="fg" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="fade"><rect width="880" height="400" fill="url(#fg)"/></mask>
  <clipPath id="clip"><rect x="1" y="1" width="878" height="398" rx="17"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
