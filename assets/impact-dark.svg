<svg xmlns="http://www.w3.org/2000/svg" width="840" height="336" viewBox="0 0 840 336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Selected impact">
<title>Selected impact</title>
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
  </linearGradient>
</defs>
<style>
  .tile { opacity:0; animation: rise .6s ease-out forwards; }
  .bar  { transform-box: fill-box; transform-origin: left; transform: scaleX(0); animation: grow .7s ease-out forwards; }
  @keyframes rise { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform:none; } }
  @keyframes grow { to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .tile,.bar { animation:none; opacity:1; transform:none; } }
</style>

<g class="tile" style="animation-delay:0.00s">
  <rect x="12" y="12" width="264" height="150" rx="14" fill="#161b22" stroke="#30363d"/>
  <rect class="bar" x="32" y="32" width="44" height="4" rx="2" fill="url(#g)" style="animation-delay:0.25s"/>
  <text x="32" y="84" font-size="40" font-weight="800" fill="url(#g)">$7,000</text>
  <text x="32" y="114" font-size="17" font-weight="700" fill="#e6edf3">SuperHack 2025 runner-up</text>
