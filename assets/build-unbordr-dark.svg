<svg xmlns="http://www.w3.org/2000/svg" width="434" height="250" viewBox="0 0 434 250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="Unbordr: Schengen visa readiness for Indian applicants: readiness score, checklist, cover letter, pre-filled forms.">
<title>Unbordr: Schengen visa readiness for Indian applicants: readiness score, checklist, cover letter, pre-filled forms.</title>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c084fc"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="217" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#c084fc"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#c084fc"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="217 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffaa40"/><stop offset="1" stop-color="#9c40ff"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".06"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#3f3f46"/></pattern>
  <radialGradient id="fg" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="fade"><rect width="434" height="250" fill="url(#fg)"/></mask>
  <clipPath id="clip"><rect x="1" y="1" width="432" height="248" rx="17"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
</defs>
<style>
.beam{animation:beam var(--d,7s) linear infinite}
@keyframes beam{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.a1{animation:a1 16s ease-in-out infinite alternate}.a2{animation:a2 19s ease-in-out infinite alternate}.a3{animation:a3 23s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(120px,40px)}}@keyframes a2{to{transform:translate(-140px,-30px)}}@keyframes a3{to{transform:translate(60px,-50px)}}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1400px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{transform:scaleY(0)}}
.mq{animation:mq var(--d,30s) linear infinite}
@keyframes mq{to{transform:translateX(var(--l))}}
.rot{opacity:0;animation:rot 12s infinite}
@keyframes rot{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.bar{opacity:1;transform:none}.rot{opacity:0}.rot0{opacity:1}}
</style>
<rect x=".5" y=".5" width="433" height="249" rx="18" fill="#0a0a0c"/><g clip-path="url(#clip)"><rect width="434" height="250" fill="url(#dots)" mask="url(#fade)"/><circle class="a1" cx="404" cy="10" r="110" fill="#34d399" opacity=".32" filter="url(#blur)"/></g><rect x=".5" y=".5" width="433" height="249" rx="18" fill="none" stroke="#27272a"/><text x="28" y="44" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#71717a">01</text><g transform="translate(346,26)"><rect x="0" y="0" width="60" height="24" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".35"/><circle class="pulse" cx="13" cy="12" r="3.5" fill="#34d399"/><text x="23" y="16" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" letter-spacing=".6" fill="#34d399">LIVE</text></g><text class="rise" x="26" y="100" font-size="32" font-weight="800" letter-spacing="-.8" fill="#fafafa">Unbordr</text><text class="rise" x="28" y="134.0" font-size="15.5" fill="#a1a1aa" style="animation-delay:0.10s">Schengen visa readiness for Indian applicants:</text><text class="rise" x="28" y="157.2" font-size="15.5" fill="#a1a1aa" style="animation-delay:0.16s">readiness score, checklist, cover letter,</text><text class="rise" x="28" y="180.5" font-size="15.5" fill="#a1a1aa" style="animation-delay:0.22s">pre-filled forms.</text><line x1="28" y1="198" x2="406" y2="198" stroke="#27272a"/><text x="28" y="226" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="url(#tg)">unbordr.in ↗</text><rect class="beam" x="1" y="1" width="432" height="248" rx="17" fill="none" stroke="url(#beam)" stroke-width="1.6" stroke-linecap="round" pathLength="100" stroke-dasharray="14 86" style="--d:7s;animation-delay:-0.0s"/>
</svg>