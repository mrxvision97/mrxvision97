<svg xmlns="http://www.w3.org/2000/svg" width="880" height="96" viewBox="0 0 880 96" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Inter','Noto Sans',Helvetica,Arial,sans-serif" role="img" aria-label="More open source on the way.">
<title>More open source on the way.</title>
<defs>
  <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="440" y2="0" spreadMethod="repeat">
    <stop offset="0" stop-color="#7c3aed"/><stop offset=".5" stop-color="#0891b2"/><stop offset="1" stop-color="#7c3aed"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="440 0" dur="6s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#9333ea"/></linearGradient>
  <linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c3aed" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed" stop-opacity=".05"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#d4d4d8"/></pattern>
  <radialGradient id="fg" cx=".5" cy=".25" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="fade"><rect width="880" height="96" fill="url(#fg)"/></mask>
  <clipPath id="clip"><rect x="1" y="1" width="878" height="94" rx="17"/></clipPath>
  <filter id="blur" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
</defs>
<style>
.beam{animation:beam var(--d,7s) linear infinite}
@keyframes beam{from{stroke-dashoffset:0}to{stroke-dashoffset:-100}}
.rise{animation:rise .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.6)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s ease-out infinite}
@keyframes ring{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(2.6)}}
.a1{animation:a1 16s ease-in-out infinite alternate}.a2{animation:a2 19s ease-in-out infinite alternate}.a3{animation:a3 23s ease-in-out infinite alternate}
@keyframes a1{to{transform:translate(120px,40px)}}@keyframes a2{to{transform:translate(-140px,-30px)}}@keyframes a3{to{transform:translate(60px,-50px)}}
.sweep{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}60%,100%{transform:translateX(1400px)}}
.bar{transform-box:fill-box;transform-origin:bottom;animation:up .6s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes up{from{transform:scaleY(0)}}
.mq{animation:mq var(--d,30s) linear infinite}
@keyframes mq{to{transform:translateX(var(--l))}}
.rot{opacity:0;animation:rot 12s infinite}
@keyframes rot{0%{opacity:0;transform:translateY(10px)}4%,22%{opacity:1;transform:none}26%,100%{opacity:0;transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.bar{opacity:1;transform:none}.rot{opacity:0}.rot0{opacity:1}}
</style>
<rect x=".5" y=".5" width="879" height="95" rx="18" fill="#ffffff"/><g clip-path="url(#clip)"><rect width="880" height="96" fill="url(#dots)" mask="url(#fade)"/><circle class="a1" cx="440.0" cy="126" r="160" fill="#9333ea" opacity=".16" filter="url(#blur)"/><rect class="sweep" x="-260" y="0" width="260" height="96" fill="url(#sw)"/></g><rect x=".5" y=".5" width="879" height="95" rx="18" fill="none" stroke="#e4e4e7"/><rect x="12" y="12" width="856" height="72" rx="12" fill="none" stroke="#a1a1aa" stroke-opacity=".6" stroke-dasharray="5 6"/><circle class="ring" cx="44" cy="48.0" r="4" fill="none" stroke="#d97706" stroke-width="1.5"/><circle class="pulse" cx="44" cy="48.0" r="4" fill="#d97706"/><text x="64" y="45.0" font-size="17" font-weight="800" fill="url(#shine)">More open source on the way</text><text x="64" y="67.0" font-size="13.5" fill="#52525b">Open-sourcing the tooling behind my products. Watch this space.</text><text x="840" y="53.0" text-anchor="end" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12.5" font-weight="600" fill="#a1a1aa">git push --soon</text>
</svg>