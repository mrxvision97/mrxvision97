name: Profile dashboard

# Rebuilds the live cards (build pulse + contribution snake) daily and
# publishes them to the `output` branch, which README.md reads from.
# Uses only the built-in GITHUB_TOKEN; no personal secrets required.

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build pulse card
        run: python scripts/cards.py pulse --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Build contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#6d28d9&color_dots=#eaeef2,#ddd6fe,#a78bfa,#7c3aed,#5b21b6
            dist/snake-dark.svg?palette=github-dark&color_snake=#22d3ee&color_dots=#161b22,#2e1065,#5b21b6,#8b5cf6,#c4b5fd

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "chore: refresh dashboard cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
