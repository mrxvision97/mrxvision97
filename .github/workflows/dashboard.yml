name: Profile dashboard

# Rebuilds the live cards (build pulse, open-source repo cards, contribution
# snake) daily and publishes them to the `output` branch, which README.md
# reads from. Uses only the built-in GITHUB_TOKEN; no personal secrets.
# Third-party actions are pinned to full commit SHAs (tag in the comment).

on:
  schedule:
    - cron: "30 0 * * *"   # daily, 06:00 IST
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # needed only to push the output branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build live cards (pulse + repo cards)
        run: python scripts/cards.py live --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}

      - name: Build contribution snake
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light&color_snake=#9333ea&color_dots=#f4f4f5,#e9d5ff,#c084fc,#9333ea,#6b21a8
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffaa40&color_dots=#18181b,#3b0764,#6b21a8,#9c40ff,#d8b4fe

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
          commit_message: "chore: refresh dashboard cards"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
